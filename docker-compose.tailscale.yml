# Secretaresse enkel via Tailscale, met HTTPS (tailscale serve). Geen poort open op de host.
# Gebruik: cp .env.example .env  (TS_AUTHKEY invullen)  →  docker compose -f docker-compose.tailscale.yml up -d --build
services:
  tailscale:
    image: tailscale/tailscale:latest
    container_name: butler-tailscale
    hostname: butler
    restart: unless-stopped
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_EXTRA_ARGS=--advertise-tags=${TS_TAG:-tag:butler}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_USERSPACE=true
    volumes:
      - ./ts-state:/var/lib/tailscale
      - ./tailscale/serve.json:/config/serve.json:ro

  butler:
    build: .
    container_name: butler
    restart: unless-stopped
    network_mode: service:tailscale   # deelt het netwerk van de Tailscale-container; enkel bereikbaar via de tailnet
    depends_on:
      - tailscale
    volumes:
      - ./config.yaml:/config/config.yaml:ro
      - ./data:/data
    environment:
      - TZ=Europe/Brussels
