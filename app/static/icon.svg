<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f6455"/>
      <stop offset="1" stop-color="#1c4237"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf7ee"/>
      <stop offset="1" stop-color="#ece4d3"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8bd62"/>
      <stop offset="1" stop-color="#c48f2e"/>
    </linearGradient>
  </defs>

  <!-- achtergrond -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- envelop (schaduw + papier) -->
  <rect x="100" y="152" width="312" height="226" rx="30" fill="#0f2a22" opacity=".28" transform="translate(0 10)"/>
  <rect x="100" y="152" width="312" height="226" rx="30" fill="url(#paper)"/>

  <!-- klep = revers van een smoking -->
  <path d="M100 182 Q100 152 130 152 H382 Q412 152 412 182 L256 296 Z" fill="#1f463b"/>
  <path d="M132 152 L256 262 L380 152 Z" fill="url(#paper)"/>

  <!-- vlinderdas op de punt -->
  <g transform="translate(256 288)">
    <path d="M-10 -6 L-74 -38 Q-88 0 -74 38 L-10 6 Z" fill="url(#gold)"/>
    <path d="M10 -6 L74 -38 Q88 0 74 38 L10 6 Z" fill="url(#gold)"/>
    <rect x="-17" y="-17" width="34" height="34" rx="10" fill="#b07d24"/>
    <rect x="-17" y="-17" width="34" height="34" rx="10" fill="none" stroke="#f3d38a" stroke-width="3" opacity=".6"/>
  </g>
</svg>
