<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#1c4237" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#173a2f" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Butler">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preload" href="/fonts/bodoni-moda-latin.woff2" as="font" type="font/woff2" crossorigin>
<title>Butler</title>
<style>
/* Butler draagt smoking: de kop is het groene jasje, de inhoud het papier van de envelop,
   en goud (de vlinderdas uit het icoon) is voorbehouden aan wat Butler zelf doet. */
@font-face{font-family:"Bodoni Moda";src:url(/fonts/bodoni-moda-latin.woff2) format("woff2");font-weight:400 700;font-style:normal;font-display:swap}
:root{
  color-scheme: light dark;
  --paper:#fbf8f1; --raised:#ffffff; --tint:#f1ece1; --ink:#17201c; --muted:#5d6862; --rule:#e5dece;
  --jacket:#1c4237; --on-jacket:#f4eedf; --on-jacket-muted:#a3bfb2; --lapel:#2f6455;
  --primary:#1c4237; --on-primary:#f4eedf;
  --gold:#8a5f12; --tie:#d9a647; --gold-tint:#f6ead0;
  --danger:#a8321c; --danger-tint:#f8e1da; --out:#eef3ef;
  --elev:0 20px 50px -18px rgb(14 30 24 / .35), 0 2px 6px rgb(14 30 24 / .08);
  --av-l:91%; --av-c:.035; --av-ink:32%;
  --display:"Bodoni Moda", "Didot", "Bodoni 72", Georgia, serif;
  --text: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  accent-color: var(--lapel);
  /* Liquid Glass voor de navigatielaag (tabbalk, werkbalk, menu's, melding): nooit voor de inhoud zelf */
  --glass-bg: color-mix(in oklab, var(--paper) 62%, transparent);
  --glass-blur: blur(22px) saturate(1.9);
  --glass-edge: rgb(255 255 255 / .6);
  --glass-shadow: 0 10px 34px -10px rgb(20 30 25 / .32), inset 0 1px 0 rgb(255 255 255 / .7);
  --glass-pill: color-mix(in oklab, var(--lapel) 13%, transparent);
  --spring: cubic-bezier(.34, 1.56, .64, 1);
}
@media (prefers-color-scheme: dark){
  :root{
    --paper:#0f1613; --raised:#151f1b; --tint:#1f2b26; --ink:#e9ede9; --muted:#98a69f; --rule:#25322c;
    --jacket:#173a2f; --on-jacket:#efe7d4; --on-jacket-muted:#7f9a8e; --lapel:#86c3ad;
    --primary:#86c3ad; --on-primary:#0c1f19;
    --gold:#e8bd62; --tie:#e8bd62; --gold-tint:#33291a;
    --danger:#f08a73; --danger-tint:#3a1f19; --out:#15241e;
    --elev:0 24px 60px -18px rgb(0 0 0 / .75), 0 2px 6px rgb(0 0 0 / .3);
    --av-l:30%; --av-c:.04; --av-ink:88%;
    --glass-bg: color-mix(in oklab, var(--raised) 58%, transparent);
    --glass-edge: rgb(255 255 255 / .12);
    --glass-shadow: 0 12px 36px -10px rgb(0 0 0 / .7), inset 0 1px 0 rgb(255 255 255 / .1);
    --glass-pill: rgb(255 255 255 / .1);
  }
}
*,*::before,*::after{box-sizing:border-box}
html{background:var(--paper);-webkit-text-size-adjust:100%;scrollbar-width:thin;scrollbar-color:color-mix(in oklab,var(--muted) 45%,transparent) transparent}
/* op iPhone en iPad volgt de tekst de tekstgrootte uit Instellingen (Dynamic Type): alle lettermaten staan in rem */
@media (pointer:coarse){@supports (font:-apple-system-body){html{font:-apple-system-body}}}
body{margin:0;background:var(--paper);color:var(--ink);font:0.9375rem/1.5 var(--text);-webkit-font-smoothing:antialiased;min-height:100dvh;-webkit-tap-highlight-color:transparent}
button,a,label,select,input{touch-action:manipulation}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--lapel);outline-offset:2px;border-radius:8px}
.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tie{width:20px;height:10px;flex:none;fill:var(--tie)}
.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.wrap{max-width:760px;margin:0 auto}

/* ---------- het jasje ---------- */
header{position:sticky;top:0;z-index:5;background:var(--jacket);color:var(--on-jacket);transition:padding .3s ease,box-shadow .3s ease;padding:calc(env(safe-area-inset-top) + 14px) max(16px,env(safe-area-inset-right)) 0 max(16px,env(safe-area-inset-left))}
.brand{display:flex;align-items:center;gap:10px}
.wordmark{flex:1;min-width:0;display:flex;flex-direction:column}
.wordmark h1{display:flex;align-items:center;gap:10px;margin:0;font:600 1.875rem/1 var(--display);letter-spacing:.005em;transform-origin:left center;transition:scale .3s ease}
/* bij scrollen klapt de grote titel in tot een compacte balk */
header.compact{padding-top:calc(env(safe-area-inset-top) + 6px);box-shadow:0 6px 20px -12px rgb(0 0 0 / .5)}
header.compact .wordmark h1{scale:.72}
header.compact .status{max-height:0;margin-top:0;opacity:0;min-height:0}
@media (max-width:699px){header.compact{padding-bottom:6px}}
.wordmark .tie{width:32px;height:15px}
.status{margin:6px 0 0 42px;font-size:0.7812rem;color:var(--on-jacket-muted);min-height:18px;max-height:24px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;transition:max-height .3s ease,opacity .2s ease,margin .3s ease}
.status .err{color:#f3b3a3}
.status .busy{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.4}}
.iconbtn{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:10px;border:0;background:transparent;color:inherit}
header .iconbtn:hover{background:rgb(255 255 255 / .08)}
.spinning .i{animation:spin 1s linear infinite}
@keyframes spin{to{rotate:360deg}}

.tabs{display:flex;gap:22px;margin-top:14px}
.tab{position:relative;border:0;background:transparent;padding:10px 0 12px;font-size:0.9375rem;font-weight:600;color:var(--on-jacket-muted);display:flex;align-items:center;gap:7px}
.tab:hover{color:var(--on-jacket)}
.tab[aria-selected=true]{color:var(--on-jacket)}
.tab[aria-selected=true]::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;border-radius:3px 3px 0 0;background:var(--tie)}
.tab .count{font-size:0.75rem;font-weight:700;min-width:20px;padding:0 6px;border-radius:99px;background:var(--tie);color:#1c2a20;text-align:center}
.tab .count:empty{display:none}
.tab .i{display:none}
/* op een gsm horen de secties in een tabbalk onderaan: een zwevende capsule van glas (navigatielaag),
   enkel de gekozen tab getint, met een pil die concentrisch in de capsule valt */
@media (max-width:699px){
  header{padding-bottom:14px}
  .tabs{position:fixed;z-index:6;margin:0;gap:2px;justify-content:space-between;
    left:max(14px,env(safe-area-inset-left));right:max(14px,env(safe-area-inset-right));bottom:calc(env(safe-area-inset-bottom) + 8px);
    padding:5px;border-radius:999px;background:var(--glass-bg);-webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur);
    border:1px solid var(--glass-edge);box-shadow:var(--glass-shadow)}
  .tab{flex:1;flex-direction:column;gap:1px;min-height:52px;padding:5px 0 4px;border-radius:999px;font-size:10.5px;color:var(--muted);
    transition:background .25s,color .25s}
  .tab:hover{color:var(--muted)}
  .tab[aria-selected=true]{color:var(--lapel);background:var(--glass-pill)}
  .tab[aria-selected=true]::after{display:none}
  .tab .i{display:block;width:24px;height:24px}
  .tab[aria-selected=true] .i{animation:tab-bounce .45s cubic-bezier(.34,1.56,.64,1)}
  .tab .count{position:absolute;top:2px;left:calc(50% + 7px);font-size:11px;min-width:18px;line-height:18px;padding:0 5px}
  main{padding-bottom:calc(env(safe-area-inset-bottom) + 104px)}
  .toast{bottom:calc(env(safe-area-inset-bottom) + 84px)}
}
@keyframes tab-bounce{40%{scale:1.18}}

/* ---------- papier ---------- */
main{padding:14px max(16px,env(safe-area-inset-right)) calc(env(safe-area-inset-bottom) + 56px) max(16px,env(safe-area-inset-left))}
.searchbox{position:relative;display:block}
.searchbox .i{position:absolute;left:14px;top:50%;translate:0 -50%;color:var(--muted);pointer-events:none}
.searchbox input{width:100%;font-size:max(1rem,16px);padding:10px 40px 10px 40px;border-radius:999px;border:1px solid var(--rule);background:var(--raised);outline:none}
.searchbox input:focus{border-color:var(--lapel);box-shadow:0 0 0 3px color-mix(in oklab,var(--lapel) 20%,transparent)}
.searchbox kbd{position:absolute;right:10px;top:50%;translate:0 -50%;font:0.75rem var(--text);color:var(--muted);border:1px solid var(--rule);border-radius:6px;padding:0 6px}
@media (hover:none){.searchbox kbd{display:none}}

.chips{display:flex;gap:6px;margin-top:6px;padding-block:4px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips:empty{display:none}
.chip{position:relative;border:1px solid var(--rule);background:transparent;border-radius:999px;padding:4px 12px;white-space:nowrap;font-size:0.8438rem;color:var(--muted)}
.chip:hover{color:var(--ink)}
.chip[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:var(--paper)}

#list{container:list/inline-size;view-transition-name:list}
.sec-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px;margin:26px 0 4px}
.sec-h h2{font:600 1.4375rem/1.2 var(--display);letter-spacing:-.01em;margin:0}
.sec-h .num{font-size:0.875rem;color:var(--muted);font-variant-numeric:tabular-nums}
.sec-h .hint{flex-basis:100%;font-size:0.8438rem;color:var(--muted)}
.note{font-size:0.8438rem;color:var(--muted);margin:2px 0 6px}

/* rijen zoals in een mailapp: geen kaartjes, wel lijnen */
.items{display:flex;flex-direction:column}
.item{position:relative;display:flex;gap:12px;padding:13px 10px;margin:0 -10px;border-radius:12px}
.item + .item::before{content:"";position:absolute;top:0;left:60px;right:10px;border-top:1px solid var(--rule)}
a.item:hover{background:var(--tint)}
a.item:hover::before,a.item:hover + .item::before{opacity:0}
.av{width:38px;height:38px;flex:none;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:0.875rem;
  background:oklch(var(--av-l) var(--av-c) var(--h,160));color:oklch(var(--av-ink) .05 var(--h,160))}
.av.me{background:var(--out);color:var(--lapel)}
/* foto of logo over de initialen; laadt het niet, dan blijven de initialen staan */
.av{position:relative;overflow:hidden}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:50%}
.av img.logo{object-fit:contain;padding:18%;background:#fff}
.av:has(img.logo){outline:1px solid var(--rule);outline-offset:-1px}
.av .i{width:16px;height:16px}
.c-main{flex:1;min-width:0}
.c-top{display:flex;align-items:baseline;gap:6px;min-width:0}
.who{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:0.9375rem}
.n{font-size:0.7812rem;color:var(--muted)}
.c-top time{font-size:0.7812rem;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.subj{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sum{color:var(--muted);font-size:0.875rem;margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-clamp:2;overflow:hidden}
.sum .tie{width:17px;height:8px;margin-right:6px;vertical-align:1px}
.item.unread .who,.item.unread .subj{font-weight:650}
.item.unread .who::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--lapel);margin-right:7px;vertical-align:1px}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:0.75rem;border-radius:6px;padding:1px 7px;background:var(--tint);color:var(--muted);white-space:nowrap}
.badge .i{width:12px;height:12px}
.badge.gold{background:var(--gold-tint);color:var(--gold);font-weight:600}
.badge.tag{background:transparent;padding-inline:0 4px}
.c-top .flag{width:13px;height:13px;color:var(--danger);align-self:center}
/* gemarkeerde mail die nu nodig is: Butler haalt ze naar voren, dus met de gouden rand */
.now .items{background:var(--raised);border:1px solid var(--rule);border-left:3px solid var(--tie);border-radius:4px 14px 14px 4px;padding:2px 12px 2px 10px}
.now .item{margin:0;padding-inline:4px}
.now .item + .item::before{left:54px;right:4px}
.moment .who{white-space:normal}
.moment .m-detail{white-space:normal;color:var(--ink)}
/* naar beneden trekken en vegen */
#ptr{display:grid;place-items:center;height:0;overflow:hidden;color:var(--muted);margin-top:-14px}
#ptr .i{width:22px;height:22px}
#ptr.ready{color:var(--lapel)}
#ptr.spinning .i{animation:spin 1s linear infinite}
#ptr.settle{transition:height .22s ease}
a.item{touch-action:pan-y}
.item.swiping{background:var(--paper);z-index:1}
.item.swiping::before{opacity:0}
.item.settle{transition:translate .2s ease}
.item.gone{display:none}
.swipe-bg{position:absolute;z-index:0;display:flex;align-items:center;justify-content:flex-end;gap:8px;padding-right:20px;
  border-radius:12px;background:color-mix(in oklab,var(--danger) 55%,var(--paper));color:#fff;font-weight:600;transition:background .15s}
.swipe-bg.ready{background:var(--danger)}
.swipe-bg.flag{justify-content:flex-start;padding:0 0 0 20px;background:color-mix(in oklab,#e8890c 55%,var(--paper))}
.swipe-bg.flag.ready{background:#e8890c}
.btn.flagged{color:var(--danger)}
.btn.flagged .i{fill:currentColor}
.now .item.swiping{background:var(--raised)}
.sender-head{display:block;width:100%;padding:0;border:0;background:none;text-align:left;color:inherit}
.ctx-add{margin:-6px 0 12px -8px;color:var(--muted)}
.ctx-show{padding:10px 14px;margin-bottom:14px;border-radius:12px;background:var(--tint)}
.ctx-show .ctx-h{display:flex;align-items:center;gap:8px}
.ctx-show .ctx-h .btn{margin-left:auto;margin-right:-8px;padding:4px 8px;font-size:0.8125rem}
.ctx-show p{margin:6px 0 0;white-space:pre-wrap}
.ctx-form{margin-bottom:16px}
.ctx-form .hint{font-size:0.8125rem;color:var(--muted);margin-top:8px}
.badge.dossier{background:var(--out);color:var(--lapel);font-weight:600;cursor:pointer}
.linkbtn{display:inline-flex;align-items:center;gap:4px;border:0;background:none;padding:0;color:var(--lapel);font:inherit;font-weight:600;cursor:pointer}
.linkbtn .i{width:14px;height:14px}
.related{margin:18px 0 0;padding:12px 14px;border-radius:12px;background:var(--tint)}
.related-h{display:flex;align-items:center;gap:8px;font-weight:600;margin-bottom:4px}
.related-h .i{width:16px;height:16px;color:var(--lapel)}
.rel{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--rule)}
.rel:first-of-type{border-top:0}
.rel span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rel time{color:var(--muted);font-size:0.8125rem;white-space:nowrap}
.item.agenda .ag-time{flex:none;width:52px;padding-top:2px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--gold)}
.item.agenda .ag-time.allday{font-weight:500;font-size:0.8125rem;color:var(--muted)}
.item.agenda .who{white-space:normal}
.item.agenda + .item.agenda::before{left:64px}
.m-when{display:block;font-size:0.8125rem;color:var(--gold);font-weight:600;font-variant-numeric:tabular-nums}
.info .tie{width:18px;height:9px}
@container list (min-width:620px){
  .item{padding:14px 12px;margin-inline:-12px}
  .item + .item::before{left:66px}
  .av{width:42px;height:42px}
}

.empty{display:grid;justify-items:center;gap:4px;text-align:center;color:var(--muted);padding:64px 16px}
.empty .mark{display:grid;place-items:center;width:64px;height:64px;border-radius:50%;background:var(--tint);margin-bottom:10px;color:var(--muted)}
.empty .mark .tie{width:36px;height:17px}
.empty .mark .i{width:26px;height:26px}
.empty b{color:var(--ink);font:600 1.375rem/1.25 var(--display)}
.quiet{padding:12px 0;color:var(--muted);font-size:0.875rem}
.ph{height:64px;margin:6px 0;border-radius:12px;background:var(--tint);opacity:.7}

/* afzenders */
.addr{font-size:0.8125rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stats{display:flex;flex-wrap:wrap;gap:2px 14px;font-size:0.8438rem;color:var(--muted);margin-top:6px}
.stats b{color:var(--ink);font-weight:600}
.meter{display:flex;align-items:center;gap:10px;margin-top:8px;font-size:0.7812rem;color:var(--muted)}
.meter span{flex:1;max-width:160px;height:5px;border-radius:99px;background:var(--tint);overflow:hidden}
.meter span::after{content:"";display:block;height:100%;width:var(--p);background:var(--lapel)}

/* ---------- knoppen ---------- */
.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--rule);background:var(--raised);border-radius:10px;padding:7px 12px;font-size:0.875rem;font-weight:500;white-space:nowrap;transition:scale .35s var(--spring),background .15s}
.btn:active,.iconbtn:active,.chip:active,.tb:active{scale:.94;transition-duration:.08s}
a.item{transition:scale .35s var(--spring),background .15s}
a.item:active{scale:.985;transition-duration:.08s}
.iconbtn,.chip{transition:scale .35s var(--spring),background .15s}
.btn:hover{border-color:color-mix(in oklab,var(--ink) 30%,var(--rule))}
.btn:active{background:var(--tint)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--on-primary);font-weight:600}
.btn.danger{color:var(--danger)}
.btn.danger.solid{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.ghost{border-color:transparent;background:transparent}
.btn:disabled{opacity:.5;pointer-events:none}
.btn .i{width:16px;height:16px}
.btn .tie{width:18px;height:9px}
select.btn{appearance:none;-webkit-appearance:none;padding-right:28px;flex:1 1 130px;min-width:0;max-inline-size:100%;
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 15px) 52%,calc(100% - 10px) 52%;background-size:5px 5px;background-repeat:no-repeat}

/* ---------- dialogen ---------- */
dialog{border:0;padding:0;color:var(--ink);background:var(--paper);box-shadow:var(--elev);
  opacity:0;translate:var(--off,0 16px);scale:var(--sc,1);
  transition-property:opacity,translate,scale,display,overlay;transition-duration:.28s;transition-timing-function:cubic-bezier(.2,.8,.2,1);
  transition-behavior:allow-discrete}
dialog:modal{overscroll-behavior:contain}
:is(dialog[open]):where(:not([data-closing])){opacity:1;translate:0 0;scale:1;
  @starting-style{opacity:0;translate:var(--off,0 16px);scale:var(--sc,1)}
  &::backdrop{background-color:rgb(6 16 12 / .45);
    @starting-style{background-color:transparent}}
}
dialog::backdrop{background-color:transparent;overflow:hidden;overscroll-behavior:contain;
  transition-property:background-color,display,overlay;transition-duration:.28s;transition-behavior:allow-discrete}

dialog.sheet{width:100%;max-width:none;height:100dvh;max-height:none;margin:0;overflow-y:auto;--off:28px 0}
dialog.sheet.center{height:calc(100dvh - env(safe-area-inset-top) - 10px);margin:auto 0 0;border-radius:14px 14px 0 0;--off:0 48px}
dialog.sheet.center .shead{padding-top:14px}
@media (min-width:900px){
  dialog.sheet{width:min(720px,62vw);margin:0 0 0 auto}
  dialog.sheet.center{width:min(560px,92vw);height:auto;max-height:min(86dvh,860px);margin:auto;border-radius:20px;--off:0 20px}
}
.shead{position:sticky;top:0;z-index:2;padding:calc(env(safe-area-inset-top) + 10px) max(16px,env(safe-area-inset-right)) 14px max(16px,env(safe-area-inset-left));background:var(--paper);border-bottom:1px solid var(--rule)}
@media (min-width:900px){.shead{padding-top:16px}}
.shead .top{display:flex;align-items:flex-start;gap:8px}
.backbtn{display:inline-flex;align-items:center;gap:2px;min-height:44px;margin-left:-10px;padding:0 10px 0 4px;border:0;background:transparent;color:var(--lapel);font-size:1.0625rem;border-radius:10px}
.backbtn .i{width:24px;height:24px;stroke-width:2.2}
.shead .top.bar{align-items:center}
.done{font-weight:600;color:var(--lapel);font-size:1.0625rem;margin-right:-10px}
.shead h2{flex:1;min-width:0;margin:2px 0 0;font:600 1.5625rem/1.2 var(--display);letter-spacing:-.01em;text-wrap:balance;overflow-wrap:anywhere}
.shead .sub{display:flex;gap:12px;font-size:0.8125rem;color:var(--muted);margin-top:4px}
.sbody{padding:16px max(16px,env(safe-area-inset-right)) calc(env(safe-area-inset-bottom) + 64px) max(16px,env(safe-area-inset-left));max-width:760px;margin:0 auto}
#sheet .sbody{padding-bottom:calc(env(safe-area-inset-bottom) + 40px)}
/* acties binnen duimbereik: een zwevende werkbalk van glas, enkel de hoofdactie getint */
.toolbar{position:sticky;bottom:calc(env(safe-area-inset-bottom) + 10px);z-index:3;display:flex;gap:2px;justify-content:space-between;
  width:min(520px,calc(100% - 28px));margin:0 auto calc(env(safe-area-inset-bottom) + 10px);padding:5px;border-radius:999px;
  background:var(--glass-bg);-webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur);border:1px solid var(--glass-edge);box-shadow:var(--glass-shadow)}
.toolbar:empty{display:none}
.tb{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;min-height:52px;padding:6px 2px 4px;border:0;border-radius:999px;background:transparent;
  color:var(--ink);font-size:10.5px;font-weight:600;transition:scale .35s var(--spring),background .15s}
.tb .i{width:22px;height:22px}
.tb:hover{background:var(--glass-pill)}
.tb.primary{background:var(--primary);color:var(--on-primary)}
.tb.on{color:var(--danger)}
.tb.on .i{fill:currentColor}
.tb:disabled{opacity:.5}
.sbody:focus{outline:none}

#ask{width:min(420px,calc(100% - 32px));border-radius:18px;--off:0 0;--sc:.96}
#ask form{padding:22px}
#ask h2{font:600 1.375rem/1.25 var(--display);margin:0 0 6px}
#ask p{margin:0 0 14px;color:var(--muted);font-size:0.9062rem}
#ask p:empty{display:none}
#ask .actions{margin-top:18px}
#ask .actions .btn{flex:1;justify-content:center;min-height:44px}

.field{width:100%;font-size:max(1rem,16px);padding:10px 12px;border-radius:10px;border:1px solid var(--rule);background:var(--raised);outline:none}
.field:focus{border-color:var(--lapel);box-shadow:0 0 0 3px color-mix(in oklab,var(--lapel) 20%,transparent)}
textarea.field{resize:vertical;line-height:1.55;field-sizing:content;height:auto;min-height:180px;min-block-size:7lh;max-height:480px;max-block-size:22lh}

/* menu's bij snoozen en meer */
.menu{margin:0;padding:6px;border:1px solid var(--glass-edge);border-radius:18px;background:var(--glass-bg);-webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur);color:var(--ink);box-shadow:var(--elev);min-width:230px;
  inset:auto 0 calc(env(safe-area-inset-bottom) + 12px) 0;margin-inline:auto;width:min(420px,calc(100% - 24px));

.menu:popover-open{opacity:1;translate:0 0;
  @starting-style{opacity:0;translate:0 6px}}
@supports (position-area:block-end){
  .menu{inset:auto;width:auto;margin:6px 0 0;position-area:block-end span-inline-end;position-try-fallbacks:flip-block,flip-inline,flip-block flip-inline}
}
.menu button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;text-align:left;padding:10px 12px;border-radius:9px;font-size:0.9375rem}
.menu button:hover{background:var(--tint)}
.menu button small{margin-left:auto;color:var(--muted);font-size:0.8125rem}
.menu .danger{color:var(--danger)}
.menu hr{border:0;border-top:1px solid var(--rule);margin:4px 8px}
.menu .pick{display:flex;gap:6px;padding:6px}
.menu .pick input{flex:1;min-width:0;padding:7px 10px}

/* ---------- thread ---------- */
.note-card{position:relative;padding:14px 16px 14px 18px;margin-bottom:18px;border-radius:4px 14px 14px 4px;background:var(--raised);border:1px solid var(--rule);border-left:3px solid var(--tie)}
.note-card .head{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.note-card .head .btn{margin-left:auto;margin-right:-8px;padding:4px 8px;font-size:0.8125rem;color:var(--muted)}
.note-card p{margin:0;font-size:1rem;line-height:1.55}
.ask-butler{width:100%;justify-content:center;padding:12px;margin-bottom:18px;border-style:dashed}
.info{display:flex;align-items:center;gap:8px;font-size:0.8438rem;color:var(--muted);margin:0 0 14px}
.msg{border-top:1px solid var(--rule)}
.msg:first-of-type{border-top:0}
.mh{display:flex;gap:12px;align-items:flex-start;width:100%;border:0;background:transparent;text-align:left;padding:14px 0 10px}
.mh .av{width:34px;height:34px;font-size:0.8125rem}
.mh .c-main{font-size:0.8125rem;color:var(--muted)}
.mh .c-top b{font-size:0.9375rem;color:var(--ink);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mh .ln{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mh .peek{display:none}
.mb{padding:0 0 18px 46px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:0.9375rem;line-height:1.6;max-width:72ch}
.msg.out .mb{border-left:2px solid color-mix(in oklab,var(--lapel) 50%,transparent);margin-left:46px;padding-left:14px}

.mb.html{white-space:normal;max-width:none}
.msg.out .mb.html{border-left:0;padding-left:46px;margin-left:0}
.mail-html{display:block;width:100%;min-height:60px;border:0;border-radius:12px;background:#fff;box-shadow:0 0 0 1px var(--rule)}
.msg.collapsed .mh .peek{display:block}
.msg.collapsed .mh .to{display:none}
#s-body{container-type:inline-size}
@container (max-width:480px){.mb,.msg.out .mb.html{padding-left:0}.msg.out .mb{margin-left:0}}

.line:first-child{border-top:0}
.line .sub{display:block;color:var(--muted);font-size:0.8125rem}
.line .group-actions{display:flex;gap:6px;flex-wrap:wrap}
label.line{cursor:pointer;justify-content:flex-start}
details.month{border-top:1px solid var(--rule)}

.muted{color:var(--muted);font-size:0.8438rem}
.group > .muted{padding:12px 0}
.fine{color:var(--muted);font-size:0.8125rem;margin:10px 2px 0}

button.line.nav{width:100%;border:0;border-top:1px solid var(--rule);background:transparent;text-align:left;color:inherit}
button.line.nav:first-child{border-top:0}

.fld{display:block;padding:12px 0;border-top:1px solid var(--rule)}
.fld:first-child,.line + .fld:first-child{border-top:0}

.fld .sub,.line .sub{display:block;color:var(--muted);font-size:0.8125rem;margin-top:4px}
.err-msg{display:block;color:var(--danger);font-size:0.8125rem;margin-top:4px}
textarea.field.short{min-height:90px;min-block-size:3lh}
.days{display:flex;gap:6px;flex-wrap:wrap}
#set-body > .backbtn{margin-bottom:8px}

.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 20px);translate:-50% 14px;background:color-mix(in oklab,var(--jacket) 88%,transparent);-webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur);color:var(--on-jacket);padding:11px 18px;border-radius:999px;z-index:20;font-size:0.9062rem;
  opacity:0;transition:opacity .2s,translate .25s cubic-bezier(.2,.8,.2,1);pointer-events:none;max-width:min(92vw,520px);box-shadow:var(--elev)}
.toast.on{opacity:1;translate:-50% 0}

::view-transition-old(list){animation:.14s ease-in both vt-out}
::view-transition-new(list){animation:.22s cubic-bezier(.2,.8,.2,1) both vt-in}
@keyframes vt-out{to{opacity:0}}
@keyframes vt-in{from{opacity:0;translate:0 6px}}

@media (pointer:coarse){
  .btn{min-height:44px;padding-inline:14px}
  .iconbtn{width:44px;height:44px}

  .chip::after{content:"";position:absolute;inset:-4px 0}

}

@media (prefers-reduced-motion:reduce){

  @starting-style{dialog[open],.menu:popover-open{translate:none;scale:none}}
  ::view-transition-group(*),::view-transition-old(*),::view-transition-new(*){animation:none !important}
  .spinning .i,.status .busy,.tab[aria-selected=true] .i{animation:none}
  .btn,.tb,a.item,.iconbtn,.chip,header,.wordmark h1,.status{transition:none}
}

const S = { tab:'followup', filter:'alle', cfilter:'reclame', account:'', q:'', accounts:[], ai:false, thread:null, loaded:{}, seq:0, hidden:new Set() };
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const I = n => `<svg class="i" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const TIE = label => `<svg class="tie" ${label?`role="img" aria-label="${label}"`:'aria-hidden="true"'}><use href="#tie"/></svg>`;
const FILTERS = [['alle','Alles'],['ongelezen','Ongelezen'],['belangrijk','Belangrijk'],['persoonlijk','Persoonlijk'],['reclame','Reclame'],['notificaties','Notificaties']];
const CFILTERS = [['reclame','Reclame'],['notificatie','Notificaties'],['alle','Alles']];
const TAB_NAMES = {followup:'Opvolgen', agenda:'Agenda', inbox:'Inbox', cleanup:'Opruimen'};
const RULES = [['none','Geen regel'],['archive_after','Archiveren na … dagen'],['archive','Altijd meteen archiveren'],['trash','Altijd meteen verwijderen'],['keep','Nooit automatisch opruimen']];
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)');

function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),2800); }

/* ---------- dialogen: animatie bij sluiten, light dismiss ook zonder closedby ---------- */
let displayTransition;
function canTransitionDisplay(){
  if(displayTransition !== undefined) return displayTransition;
  if(!window.CSS?.supports?.('transition-behavior','allow-discrete')) return displayTransition = false;
  const p = document.createElement('div');
  p.style.cssText = 'transition: display 1s allow-discrete !important; display: block;';
  document.body.appendChild(p); getComputedStyle(p).display; p.style.display = 'none';
  displayTransition = getComputedStyle(p).display === 'block'; p.remove();
  return displayTransition;
}
async function closeTopLayer(d, value){
  if(!d.open) return;
  if(!(CSS.supports?.('overlay','auto') && canTransitionDisplay())){
    d.setAttribute('data-closing','');
    const anims = d.getAnimations({subtree:true});
    if(anims.length) await Promise.race([Promise.allSettled(anims.map(a=>a.finished)), new Promise(r=>setTimeout(r,600))]);
    if(!d.hasAttribute('data-closing')) return;
    d.removeAttribute('data-closing');
  }
  d.close(value);
}
function wireDialog(d, requestClose){
  d.addEventListener('cancel', e => { e.preventDefault(); requestClose(); });
  if(!('closedBy' in HTMLDialogElement.prototype)) d.addEventListener('click', e => {
    if(e.target !== d) return;
    const r = d.getBoundingClientRect();
    if(r.top <= e.clientY && e.clientY <= r.bottom && r.left <= e.clientX && e.clientX <= r.right) return;
    requestClose();
  });
}
function openDialog(d){ d.removeAttribute('data-closing'); if(!d.open) d.showModal(); }

/* vervangt prompt() en confirm(): ask({title, msg, input, value, type, ok, danger}) → waarde, true of null */
function ask({title, msg='', input=false, value='', type='text', ok='OK', danger=false}){
  const d = $('#ask'), inp = $('#ask-input'), okb = $('#ask-ok');
  $('#ask-title').textContent = title; $('#ask-msg').textContent = msg;
  inp.hidden = !input; inp.type = type; inp.value = value ?? '';
  okb.textContent = ok; okb.className = 'btn ' + (danger ? 'danger solid' : 'primary');
  d.returnValue = '';
  openDialog(d);
  if(input){ inp.focus(); inp.select(); } else okb.focus();
  return new Promise(res => d.addEventListener('close', () => res(d.returnValue==='ok' ? (input ? inp.value : true) : null), {once:true}));
}
wireDialog($('#ask'), () => closeTopLayer($('#ask'), ''));
$('#ask [data-close]').onclick = () => closeTopLayer($('#ask'), '');

/* ---------- API ---------- */
let login = null;
async function api(path, opts={}){
  let token=''; try{ token=localStorage.getItem('butler_token')||''; }catch(e){}
  const r = await fetch(path, {...opts, headers:{'Content-Type':'application/json', ...(token?{Authorization:'Bearer '+token}:{})}});
  if(r.status===401){
    login ??= ask({title:'Aanmelden bij Butler', msg:'Om je mail te tonen heeft Butler het toegangstoken nodig. Je vindt het in config.yaml onder app.token.', input:true, type:'password', ok:'Aanmelden'})
      .finally(() => setTimeout(() => { login = null; }));
    const n = await login;
    if(n){ try{ localStorage.setItem('butler_token', n.trim()); }catch(e){} return api(path, opts); }
    throw new Error('Niet aangemeld');
  }
  if(!r.ok){ let d=r.statusText; try{ d=(await r.json()).detail||d; }catch(e){}
    const err = new Error(typeof d === 'string' ? d : d.message || r.statusText); err.errors = d.errors; throw err; }
  return r.json();
}
const post = (p, body={}) => api(p, {method:'POST', body:JSON.stringify(body)});

function when(iso){
  if(!iso) return '';
  const d=new Date(iso), now=new Date();
  if(d.toDateString()===now.toDateString()) return d.toLocaleTimeString('nl-BE',{hour:'2-digit',minute:'2-digit'});
  const diff=(now-d)/864e5;
  if(diff<6) return d.toLocaleDateString('nl-BE',{weekday:'short'});
  return d.toLocaleDateString('nl-BE',{day:'numeric',month:'short', year: d.getFullYear()!==now.getFullYear()?'numeric':undefined});
}
const fullDate = iso => iso ? new Date(iso).toLocaleString('nl-BE',{dateStyle:'medium',timeStyle:'short'}) : '';
const shortDay = d => new Date(Date.now()+d*864e5).toLocaleDateString('nl-BE',{weekday:'short',day:'numeric',month:'short'});
const dayMonth = iso => new Date(iso).toLocaleDateString('nl-BE',{day:'numeric',month:'short'});

function avatar(name, me=false, url=null){
  const s = String(name||'?').replace(/^Jij → /,'').replace(/<.*>/,'').trim();
  const words = s.split(/[\s@._-]+/).filter(w=>/^[\p{L}\p{N}]/u.test(w));
  const ini = ((words[0]||'?')[0] + (words.length>1 ? words[1][0] : '')).toUpperCase();
  let h = 0; for(const c of s.toLowerCase()) h = (h*31 + c.charCodeAt(0)) % 360;
  const img = url && !me ? `<img src="${esc(url)}" alt="" loading="lazy" decoding="async" class="${url.includes('-logo.') ? 'logo' : 'face'}">` : '';
  return `<span class="av ${me?'me':''}" style="--h:${h}" aria-hidden="true">${me ? I('send') : esc(ini)}${img}</span>`;
}

/* ---------- lijst ---------- */
function renderChips(){
  const multi = S.accounts.length>1;
  $('#accounts').innerHTML = multi ? [['','Alle accounts'],...S.accounts.map(a=>[a.id,a.name])]
    .map(([id,n])=>`<button class="chip" aria-pressed="${S.account===id}" data-acc="${esc(id)}">${esc(n)}</button>`).join('') : '';
  $('#filters').innerHTML = S.tab==='inbox' ? FILTERS.map(([k,n])=>`<button class="chip" aria-pressed="${S.filter===k}" data-f="${k}">${n}</button>`).join('')
    : S.tab==='cleanup' ? CFILTERS.map(([k,n])=>`<button class="chip" aria-pressed="${S.cfilter===k}" data-cf="${k}">${n}</button>`).join('') : '';
  document.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-selected', b.dataset.tab===S.tab));
}

function renderStatus(syncing=false){
  const bad = S.accounts.filter(a=>a.status==='fout');
  const last = S.accounts.map(a=>a.last_sync).filter(Boolean).sort().pop();
  const backlog = S.accounts.reduce((n,a)=>n+(a.backlog||0), 0);
  const errs = bad.map(a=>`<span class="err">${esc(a.name)}: ${esc(a.error||'fout')}</span>`).join(', ');
  if(S.accountsLoaded && !S.accounts.length){ $('#status').textContent = 'Nog geen mailaccount'; return; }
  $('#status').innerHTML = errs ? errs
    : (syncing || !last) ? '<span class="busy">Synchroniseren…</span>' : 'Bijgewerkt om '+esc(new Date(last).toLocaleTimeString('nl-BE',{hour:'2-digit',minute:'2-digit'}))
      + (backlog ? `, nog ${backlog.toLocaleString('nl-BE')} oude mails te halen` : '');
}

function card(c, mode){
  const badges = [];
  if(c.priority==='hoog') badges.push('<span class="badge gold">Belangrijk</span>');
  if(c.deadline) badges.push(`<span class="badge">${I('clock')}tegen ${esc(dayMonth(c.deadline))}</span>`);
  if(mode==='them'){ const d=Math.floor(c.age_days); if(d>=1) badges.push(`<span class="badge">${d} dagen stil</span>`); }
  if(mode==='me'){ const d=Math.floor(c.age_days); if(d>=1) badges.push(`<span class="badge">${d} dagen oud</span>`); }
  if(c.category && c.category!=='overig') badges.push(`<span class="badge">${esc(c.category)}</span>`);
  if(S.accounts.length>1) badges.push(`<span class="badge">${esc(c.account_name)}</span>`);
  c.tags.forEach(t => badges.push(`<span class="badge tag">#${esc(t)}</span>`));
  if(c.dossier && mode !== 'dossier') badges.unshift(`<span class="badge dossier" data-dossier="${c.dossier.id}">${I('folder')}${esc(c.dossier.name)}</span>`);
  return `<a class="item ${c.unread?'unread':''}" href="#t=${c.tid}" data-tid="${c.tid}" data-flagged="${c.flagged?1:0}">
    ${avatar(c.who, c.last_outgoing, c.avatar)}
    <div class="c-main">
      <div class="c-top"><span class="who">${esc(c.who)}</span>${c.n>1?`<span class="n">${c.n}</span>`:''}${c.flagged?'<svg class="i flag" role="img" aria-label="Gemarkeerd"><use href="#i-flag"/></svg>':''}<time datetime="${esc(c.date)}">${esc(when(c.date))}</time></div>
      <div class="subj">${esc(c.subject || '(geen onderwerp)')}</div>
      <div class="sum">${c.summary ? TIE('Samenvatting door Butler')+esc(c.summary) : esc(c.snippet)}</div>
      ${badges.length?`<div class="meta">${badges.join('')}</div>`:''}
    </div>
  </a>`;
}

// wanneer een moment begint (binnenkort) of tot wanneer het loopt (nu)
function momentWhen(m, active){
  const d = new Date(active ? m.until : m.at), now = new Date(), tomorrow = new Date(Date.now()+864e5);
  const t = d.toLocaleTimeString('nl-BE',{hour:'2-digit',minute:'2-digit'});
  const day = d.toDateString()===now.toDateString() ? (active ? '' : 'vandaag ')
    : d.toDateString()===tomorrow.toDateString() ? 'morgen ' : d.toLocaleDateString('nl-BE',{weekday:'short',day:'numeric',month:'short'})+' ';
  return (active ? 'tot ' : '') + day + t;
}
/* agenda: alles wat aan een datum hangt, per dag */
function dayLabel(key){
  const d = new Date(key + 'T12:00:00'), today = new Date(), tomorrow = new Date(Date.now() + 864e5);
  if(d.toDateString() === today.toDateString()) return 'Vandaag';
  if(d.toDateString() === tomorrow.toDateString()) return 'Morgen';
  return d.toLocaleDateString('nl-BE', {weekday:'long', day:'numeric', month:'long', year: d.getFullYear() !== today.getFullYear() ? 'numeric' : undefined});
}
const localDay = iso => { const d = new Date(iso); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
function agendaView(items){
  if(!items.length) return empty('Niets gepland', 'Markeer een mail met een vlucht, concert of afspraak; Butler zet het hier op de juiste dag.', I('cal'));
  const days = {};
  for(const c of items){
    const key = c.allday ? c.sort.slice(0, 10) : localDay(c.moment.at);
    (days[key] ||= []).push(c);
  }
  return Object.entries(days).map(([key, list]) => `<section><div class="sec-h"><h2>${esc(dayLabel(key))}</h2></div><div class="items">${list.map(c => {
    const m = c.moment, time = m ? new Date(m.at).toLocaleTimeString('nl-BE', {hour:'2-digit', minute:'2-digit'}) : 'hele dag';
    return `<a class="item agenda" href="#t=${c.tid}" data-tid="${c.tid}">
      <time class="ag-time ${m ? '' : 'allday'}">${esc(time)}</time>
      <div class="c-main">
        <div class="c-top"><span class="who"><b>${esc(m ? m.title : (c.subject || '(geen onderwerp)'))}</b></span></div>
        ${m?.detail ? `<div class="subj m-detail">${esc(m.detail)}</div>` : ''}
        <div class="sum">${m ? TIE() + esc(c.who) + ': ' + esc(c.subject || '') : esc(m ? '' : 'Deadline, ' + c.who)}</div>
        ${c.dossier ? `<div class="meta"><span class="badge dossier" data-dossier="${c.dossier.id}">${I('folder')}${esc(c.dossier.name)}</span></div>` : ''}
      </div></a>`;
  }).join('')}</div></section>`).join('');
}

function momentCard(c, active){
  const m = c.moment;
  return `<a class="item moment" href="#t=${c.tid}" data-tid="${c.tid}">
    ${avatar(c.who, false, c.avatar)}
    <div class="c-main">
      <div class="c-top"><span class="who"><b>${esc(m.title)}</b></span></div>
      <time class="m-when" datetime="${esc(active ? m.until : m.at)}">${esc(momentWhen(m, active))}</time>
      ${m.detail ? `<div class="subj m-detail">${esc(m.detail)}</div>` : ''}
      <div class="sum">${TIE()}${esc(c.who)}: ${esc(c.subject || '(geen onderwerp)')}</div>
    </div>
  </a>`;
}

const empty = (title, sub='', mark=I('inbox')) => `<div class="empty"><span class="mark">${mark}</span><b>${title}</b>${sub?`<span>${sub}</span>`:''}</div>`;
const placeholder = () => '<div style="margin-top:22px">' + '<div class="ph"></div>'.repeat(5) + '</div>';

// wat op de achtergrond gearchiveerd of verwijderd wordt, staat al niet meer in de lijst
const vis = arr => (arr || []).filter(c => !S.hidden.has(c.tid));

// archiveren en verwijderen gaan via IMAP en duren soms even: meteen weg, de server werkt op de achtergrond verder
function inBackground(tid, path, done, failed){
  S.hidden.add(tid);
  toast(done);
  post(path).catch(e => toast(`${failed}: ${e.message}`)).finally(() => { S.hidden.delete(tid); load(); });
}

function swapList(html, animate){
  const run = () => { $('#list').innerHTML = html; };
  if(animate && document.startViewTransition && !reduceMotion.matches) document.startViewTransition(run);
  else run();
}

async function load(animate=false){
  renderChips();
  const key = S.tab+'|'+S.account+'|'+S.filter+'|'+S.cfilter+'|'+S.q+'|'+(S.dossier||''), seq = ++S.seq;
  if(!S.loaded[key]) $('#list').innerHTML = placeholder();
  const acc = encodeURIComponent(S.account);
  let html;
  try{
    if(S.dossier){  // alle mail die over hetzelfde gaat, met wat eraan komt bovenaan
      const d = await api(`/api/dossiers/${S.dossier}`);
      const due = d.moments.filter(c => new Date(c.moment.at) <= new Date()), later = d.moments.filter(c => new Date(c.moment.at) > new Date());
      html = `<button class="backbtn" data-dossier-back>${I('back')}<span>${TAB_NAMES[S.tab]}</span></button>
        <div class="sec-h"><h2>${esc(d.dossier.name)}</h2><span class="num">${d.threads.length}</span></div>`
        + (due.length ? `<section class="now"><div class="items">${due.map(c => momentCard(c, true)).join('')}</div></section>` : '')
        + (later.length ? `<div class="items">${later.map(c => momentCard(c, false)).join('')}</div>` : '')
        + `<div class="items">${vis(d.threads).map(c => card(c, 'dossier')).join('')}</div>`;
    } else if(S.tab==='agenda'){
      const d = await api(`/api/agenda?account=${acc}`);
      html = agendaView(vis(d.items));
    } else if(S.tab==='inbox'){
      const d = await api(`/api/inbox?account=${acc}&filter=${S.filter}&q=${encodeURIComponent(S.q)}`);
      d.threads = vis(d.threads);
      html = d.threads.length ? `<div class="items" style="margin-top:12px">${d.threads.map(c=>card(c)).join('')}</div>`
        : S.q ? empty('Niets gevonden', `Geen mail met “${esc(S.q)}”. Zoeken gaat over onderwerp, afzender en tekst.`, I('search'))
        : empty('Inbox leeg', 'Nieuwe mail verschijnt hier vanzelf.');
    } else if(S.tab==='cleanup'){
      const d = await api(`/api/senders?account=${acc}&kind=${S.cfilter}`);
      if(seq!==S.seq) return;
      S.senders = d.senders;
      const dflt = S.cfilter==='notificatie' ? d.defaults.notificatie_days : S.cfilter==='reclame' ? d.defaults.reclame_days : 0;
      const inInbox = d.senders.reduce((a,x)=>a+x.in_inbox,0);
      const kindIn = S.cfilter === 'alle' ? 0 : inInbox;
      html = `<div class="sec-h"><h2>Afzenders</h2><span class="num">${d.senders.length}</span><span class="hint">${inInbox} mails in je inbox</span></div>`
        + (kindIn ? `<div class="actions" style="margin:4px 0 8px"><button class="btn primary" data-s="archive-kind">${I('archive')}Alle ${S.cfilter === 'reclame' ? 'reclame' : 'notificaties'} archiveren (${kindIn})</button></div>` : '')
        + (dflt ? `<div class="note">Zonder regel wordt na ${dflt} dagen automatisch gearchiveerd.</div>` : '')
        + (d.senders.length ? `<div class="items">${d.senders.map((x,i)=>senderCard(x,i)).join('')}</div>`
          : empty('Niets op te ruimen', 'Geen afzenders in deze categorie.', I('check')));
    } else {
      const d = await api(`/api/followup?account=${acc}`);
      for(const k of ['waiting_on_me', 'waiting_on_them', 'reminders', 'moments_now', 'moments_soon']) d[k] = vis(d[k]);
      // een vlak verschijnt pas als er iets in staat
      const sec = (title, arr, mode, hint='') => !arr.length ? '' : `<section><div class="sec-h"><h2>${title}</h2><span class="num">${arr.length}</span>${hint?`<span class="hint">${hint}</span>`:''}</div>`
        + `<div class="items">${arr.map(c=>card(c,mode)).join('')}</div></section>`;
      const now = d.moments_now || [], soon = d.moments_soon || [];
      const msec = (title, arr, active, cls='') => arr.length ? `<section class="${cls}"><div class="sec-h"><h2>${title}</h2><span class="num">${arr.length}</span></div>`
        + `<div class="items">${arr.map(c=>momentCard(c, active)).join('')}</div></section>` : '';
      $('#count-followup').textContent = (d.waiting_on_me.length + d.reminders.length + now.length) || '';
      html = (!d.waiting_on_me.length && !d.waiting_on_them.length && !d.reminders.length && !now.length && !soon.length)
        ? empty('Alles afgehandeld', 'Er wacht niets op jou, en jij wacht op niemand.', TIE())
        : msec('Nu nodig', now, true, 'now') +
          sec('Herinneringen', d.reminders, 'rem') +
          sec('Wacht op jou', d.waiting_on_me, 'me') +
          sec('Wacht op antwoord', d.waiting_on_them, 'them', `${d.followup_days} dagen of langer stil`) +
          msec('Binnenkort', soon, false);
    }
  }catch(e){ html = empty('Laden mislukt', esc(e.message) + '. Probeer opnieuw met de vernieuwknop bovenaan.', I('x')); }
  if(seq!==S.seq) return;
  if(S.accountsLoaded && !S.accounts.length)  // nog niets ingesteld: meteen naar het eerste account
    html = empty('Nog geen mailaccount', 'Voeg je Gmail- of iCloud-account toe; daarna haalt Butler je mail op.', I('inbox'))
      + `<div class="actions" style="justify-content:center"><button class="btn primary" id="add-first">${I('plus')}Account toevoegen</button></div>`;
  S.loaded[key] = true;
  swapList(html, animate);
}

function senderCard(x, i){
  const b = [`<span class="badge">${x.kind==='reclame'?'reclame':x.kind==='notificatie'?'notificatie':'persoonlijk'}</span>`];
  if(x.unsubscribed_at) b.push(`<span class="badge">${I('check')}uitgeschreven</span>`);
  if(S.accounts.length>1) b.push(`<span class="badge">${esc(x.account_name)}</span>`);
  const rule = RULES.map(([k,n])=>`<option value="${k}" ${x.action===k?'selected':''}>${n.replace('…', x.after_days)}</option>`).join('');
  const unsub = x.unsub_method && !x.unsubscribed_at
    ? `<button class="btn" data-s="unsub" data-i="${i}">${I(x.unsub_method==='link'?'ext':'bell-off')}Uitschrijven</button>` : '';
  return `<article class="item">
    ${avatar(x.name, false, x.avatar)}
    <div class="c-main">
      <button class="sender-head" data-s="mails" data-i="${i}" aria-label="Mails van ${esc(x.name)} bekijken">
        <div class="c-top"><span class="who"><b>${esc(x.name)}</b></span><time>${esc(when(x.last_date))}</time></div>
        <div class="addr">${esc(x.addr)}</div></button>
      <div class="meta">${b.join('')}</div>
      <div class="stats"><span><b>${x.n}</b> mails</span><span><b>${x.in_inbox}</b> in je inbox</span></div>
      ${x.read_pct!==null?`<div class="meter" style="--p:${x.read_pct}%"><span></span>${x.read_pct}% gelezen</div>`:''}
      <div class="actions">
        <button class="btn" data-s="mails" data-i="${i}">${I('inbox')}Mails</button>
        ${unsub}
        ${x.in_inbox?`<button class="btn" data-s="archive" data-i="${i}">${I('archive')}Archiveer ${x.in_inbox}</button>`:''}
        ${x.in_inbox?`<button class="btn danger" data-s="trash" data-i="${i}" aria-label="Verwijder ${x.in_inbox} mails">${I('trash')}${x.in_inbox}</button>`:''}
        <select class="btn" data-rule="${i}" aria-label="Regel voor ${esc(x.name)}">${rule}</select>
        <select class="btn" data-kind="${i}" aria-label="Soort afzender">
          <option value="">Soort…</option><option value="reclame">Is reclame</option>
          <option value="notificatie">Is notificatie</option><option value="persoonlijk">Is persoonlijk</option>
        </select>
      </div>
    </div></article>`;
}

async function senderAction(a, i, btn){
  if(a === 'archive-kind'){
    const n = S.senders.reduce((t, x) => t + x.in_inbox, 0), what = S.cfilter === 'reclame' ? 'reclame' : 'notificaties';
    if(!await ask({title:`${n} mails archiveren?`, msg:`Alle ${what} uit je inbox gaat naar het archief. Er wordt niets verwijderd.`, ok:'Archiveren'})) return;
    toast(`${n} mails worden gearchiveerd`);
    post('/api/senders/archive-kind', {kind: S.cfilter, account: S.account})
      .then(r => toast(`${r.moved} gearchiveerd`)).catch(e => toast('Archiveren mislukt: ' + e.message)).finally(() => load());
    return;
  }
  const x = S.senders[i]; const who = {account:x.account, addr:x.addr};
  if(a === 'mails'){  // alle mail van deze afzender, ook gearchiveerde: via zoeken in de inbox-tab
    S.q = x.addr; $('#q').value = x.addr; S.tab = 'inbox'; S.filter = 'alle'; return load(true);
  }
  if(btn) btn.disabled = true;
  try{
    if(a==='unsub'){
      if(x.unsub_method==='link'){
        if(!await ask({title:`Uitschrijven bij ${x.name}`, msg:'Deze afzender heeft enkel een uitschrijfpagina. Die opent in een nieuw venster.', ok:'Pagina openen'})) return;
        const r = await post('/api/senders/unsubscribe', who); window.open(r.url, '_blank', 'noopener'); return;
      }
      if(!await ask({title:`Uitschrijven bij ${x.name}?`, msg:'Nieuwe mails van deze afzender gaan daarna automatisch naar het archief.', ok:'Uitschrijven'})) return;
      const r = await post('/api/senders/unsubscribe', who);
      toast(r.method==='one-click' ? 'Uitgeschreven' : 'Uitschrijfmail verstuurd');
    }
    if(a==='archive'){ const r = await post('/api/senders/archive', who); toast(`${r.moved} gearchiveerd`); }
    if(a==='trash'){ if(!await ask({title:`${x.in_inbox} mails verwijderen?`, msg:`Alle mails van ${x.name} in je inbox gaan naar de prullenbak.`, ok:'Verwijderen', danger:true})) return;
      const r = await post('/api/senders/trash', who); toast(`${r.moved} verwijderd`); }
    load();
  }catch(e){ toast('Mislukt: '+e.message); }
  finally{ if(btn && btn.isConnected) btn.disabled = false; }
}

async function loadAccounts(){
  try{
    const d = await api('/api/accounts'); S.accounts=d.accounts; S.ai=d.ai;
    S.ai_provider = d.ai_provider; S.ai_providers = d.ai_providers; S.accountsLoaded = true;
    renderStatus(); renderChips();
  }catch(e){}
}

/* ---------- thread ---------- */
const sheet = $('#sheet');
async function openThread(tid, push=true){
  if(push) history.pushState({tid}, '', '#t='+tid);
  const fresh = !sheet.open || S.thread?.tid !== tid;
  $('#back-label').textContent = TAB_NAMES[S.tab];
  if(fresh){ $('#s-title').textContent=''; $('#s-meta').innerHTML=''; $('#s-body').innerHTML=placeholder(); $('#s-actions').innerHTML=''; }
  openDialog(sheet);
  try{ S.thread = await api('/api/threads/'+tid); renderThread(); if(fresh){ sheet.scrollTop = 0; $('#s-body').focus({preventScroll:true}); } }
  catch(e){ $('#s-body').innerHTML = empty('Deze mail opent niet', esc(e.message), I('x')); }
}
function closeThread(){

  else closeTopLayer(sheet);
}
sheet.addEventListener('close', () => {
  S.thread = null;
  if(location.hash.startsWith('#t=')) history.replaceState(null, '', location.pathname + location.search);
  load();
});
wireDialog(sheet, closeThread);

function renderThread(){
  const t = S.thread;
  $('#s-title').textContent = t.subject || '(geen onderwerp)';
  $('#s-meta').innerHTML = [S.accounts.length>1 ? t.account_name : '', `${t.n} bericht${t.n>1?'en':''}`, t.done?'afgehandeld':'']
    .filter(Boolean).map(x=>`<span>${esc(x)}</span>`).join('')
    + (t.dossier ? `<button class="linkbtn" data-dossier="${t.dossier.id}">${I('folder')}${esc(t.dossier.name)}</button>` : '');
  // werkbalk onderaan: binnen duimbereik, enkel de hoofdactie getint
  const T = (id, icon, label, cls='', extra='') => `<button class="tb ${cls}" data-a="${id}" ${extra}>${I(icon)}<span>${label}</span></button>`;
  $('#s-actions').innerHTML = [
    t.in_inbox ? T('archive','archive','Archiveer','primary') : '',
    t.done ? T('undone','undo','Heropen') : T('done','check','Klaar'),
    T(t.flagged ? 'unflag' : 'flag', 'flag', t.flagged ? 'Gemarkeerd' : 'Markeer', t.flagged ? 'on' : '', `aria-pressed="${!!t.flagged}"`),
    `<button class="tb" popovertarget="snooze-menu">${I('clock')}<span>Snooze</span></button>`,
    `<button class="tb" popovertarget="more-menu">${I('more')}<span>Meer</span></button>`
  ].join('');
  $('#more-menu').innerHTML = [
    t.unread ? `<button data-a="read">${I('read')}Markeer als gelezen</button>` : '',
    `<button data-a="tags">${I('tag')}Tags bewerken</button>`,
    t.dossier ? `<button data-a="dossier-remove">${I('folder')}Uit het dossier halen</button>` : '',
    t.in_inbox ? `<hr><button data-a="trash" class="danger">${I('trash')}Naar de prullenbak</button>` : ''
  ].join('');
  [1,3,7].forEach(d => $('#sn'+d).textContent = shortDay(d));
  $('#snooze-date').min = new Date(Date.now()+864e5).toISOString().slice(0,10);

  let note = '';
  if(t.summary){
    const facts = [
      t.priority==='hoog' ? '<span class="badge gold">Belangrijk</span>' : t.priority ? `<span class="badge">prioriteit ${esc(t.priority)}</span>` : '',
      t.action ? `<span class="badge">${esc(t.action)}</span>` : '',
      t.deadline ? `<span class="badge">${I('clock')}tegen ${esc(dayMonth(t.deadline))}</span>` : '',
      t.category ? `<span class="badge">${esc(t.category)}</span>` : '',
      t.summary_stale ? '<span class="badge">nieuwe berichten sinds deze samenvatting</span>' : ''
    ].join('');
    note = `<div class="note-card"><div class="head">${TIE('Samenvatting door Butler')}<span class="muted">Butler vat samen</span>
        ${t.ai_available?`<button class="btn ghost" data-a="summarize">${I('refresh')}Opnieuw</button>`:''}</div>
      <p>${esc(t.summary)}</p>${facts?`<div class="meta">${facts}</div>`:''}</div>`;
  } else if(t.ai_available){
    note = `<button class="btn ask-butler" data-a="summarize">${TIE()}Laat Butler samenvatten</button>`;
  }
  const context = `<div id="ctx">${contextView(t)}</div>`;
  const related = (t.dossier_threads || []).length ? `<div class="related"><div class="related-h">${I('folder')}<span>Ook in ${esc(t.dossier.name)}</span></div>
    ${t.dossier_threads.map(r => `<a class="rel" href="#t=${r.tid}" data-tid="${r.tid}"><span>${esc(r.subject || '(geen onderwerp)')}</span><time>${esc(when(r.date))}</time></a>`).join('')}</div>` : '';
  const upcoming = (t.moments || []).map(m => `<div class="info">${TIE()}<span><b>${esc(m.title)}</b>, ${esc(momentWhen(m, new Date(m.at) <= new Date()))}</span></div>`).join('');
  const snooze = t.snooze_until ? `<div class="info">${I('clock')}Gesnoozed tot ${esc(fullDate(t.snooze_until))}</div>` : '';
  const tags = t.tags.length ? `<div class="meta" style="margin:0 0 14px">${t.tags.map(x=>`<span class="badge tag">#${esc(x)}</span>`).join('')}</div>` : '';

  const n = t.messages.length;
  const msgs = t.messages.map((m,i)=>{
    const names = l => l.map(([nm,a])=>nm||a).join(', ');
    const collapsed = i < n-2 ? 'collapsed' : '';
    const name = m.outgoing ? 'Jij' : (m.from_name||m.from_addr);
    const to = 'aan ' + names(m.to) + (m.cc.length ? ', cc ' + names(m.cc) : '');
    return `<article class="msg ${m.outgoing?'out':''} ${collapsed}">
      <button class="mh" data-toggle aria-expanded="${!collapsed}">
        ${avatar(name, m.outgoing, m.avatar)}
        <div class="c-main">
          <div class="c-top"><b>${esc(name)}</b><span class="ln" style="flex:1">${m.outgoing?'':esc(m.from_addr)}</span><time title="${esc(fullDate(m.date))}">${esc(when(m.date))}</time></div>
          <div class="ln to">${esc(to)}${m.pending?', verzonden':''}</div>
          <div class="ln peek">${esc((m.body||'').replace(/\s+/g,' ').slice(0,160))}</div>
        </div>
      </button>
      <div class="mb" data-mid="${m.id}">${esc(m.body)}</div></article>`;
  }).join('');

  const compose = `<section class="compose">
      <h3>Antwoorden</h3>
      ${t.ai_available?`<div class="ins"><input type="text" class="field" id="instr" placeholder="Wat wil je zeggen? Bv. akkoord, voorstel dinsdag 14u" enterkeyhint="go">
        <button class="btn" data-a="draft">${TIE()}Stel voor</button></div>`:''}
      <textarea class="field" id="reply" placeholder="Je antwoord" aria-label="Je antwoord"></textarea>
      <div class="opts">
        <label><input type="checkbox" switch id="replyall"> Allen beantwoorden</label>
        <label><input type="checkbox" switch id="arch" ${t.in_inbox?'checked':''}> Archiveren na rechtstreeks versturen</label>
      </div>
      <div class="actions">
        <button class="btn primary" data-a="savedraft">${I('draft')}Zet als concept</button>
        <button class="btn" data-a="send">${I('send')}Rechtstreeks versturen</button>
      </div>
      <div class="hint">Een concept komt in je Concepten-map, dus ook in Spark. Daar kijk je het na en verstuur je het.</div>
    </section>`;

  const keep = $('#reply')?.value, keepInstr = $('#instr')?.value;
  $('#s-body').innerHTML = note + context + upcoming + snooze + tags + msgs + related + compose;
  if(keep) $('#reply').value = keep;
  if(keepInstr && $('#instr')) $('#instr').value = keepInstr;
  showHtmlMessages();
}

/* ---------- context voor Butler: wat je zelf weet over deze mail of afzender ---------- */
function contextView(t){
  const ctx = t.context, sctx = t.sender?.context;
  if(!ctx && !sctx) return `<button class="btn ghost ctx-add" data-a="ctx-edit">${I('plus')}Geef Butler context</button>`;
  return `<div class="ctx-show"><div class="ctx-h">${TIE()}<span class="muted">Wat Butler van jou weet</span><button class="btn ghost" data-a="ctx-edit">Wijzigen</button></div>
    ${ctx ? `<p>${esc(ctx)}</p>` : ''}${sctx ? `<p><span class="muted">Over ${esc(t.sender.name)}:</span> ${esc(sctx)}</p>` : ''}</div>`;
}
function contextForm(t){
  const forSender = !t.context && !!t.sender?.context;
  return `<div class="ctx-form">
    <textarea class="field short" id="ctx-text" placeholder="Bv. dit is al betaald. Of: dit is mijn boekhouder, antwoord altijd formeel.">${esc(forSender ? t.sender.context : t.context)}</textarea>
    ${t.sender ? `<div class="opts"><label><input type="checkbox" switch id="ctx-sender" ${forSender ? 'checked' : ''}> Voor alle mail van ${esc(t.sender.name)}</label></div>` : ''}
    <div class="actions"><button class="btn primary" data-a="ctx-save">Bewaren</button><button class="btn ghost" data-a="ctx-cancel">Annuleren</button></div>
    <div class="hint">Butler gebruikt dit bij samenvatten, antwoordvoorstellen en momenten.</div></div>`;
}
$('#s-body').addEventListener('change', e => {  // wisselen tussen deze mail en de afzender toont wat daar al staat
  if(e.target.id === 'ctx-sender' && S.thread) $('#ctx-text').value = e.target.checked ? (S.thread.sender?.context || '') : (S.thread.context || '');
});

/* ---------- HTML-mails: in een iframe zonder scripts; externe afbeeldingen komen via Butler ---------- */
const mailDoc = html => `<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data: ${location.origin}; style-src 'unsafe-inline'; font-src data:">
<base target="_blank"><style>html,body{margin:0;background:#fff;color:#1b1b1b}
body{padding:14px;font:15px/1.5 -apple-system,system-ui,sans-serif;overflow-wrap:anywhere}img{max-width:100%;height:auto}</style>
</head><body>${html}</body></html>`;

function showHtmlMessages(){
  for(const el of $('#s-body').querySelectorAll('.mb[data-mid]')){
    if(!el.dataset.done && !el.closest('.msg').classList.contains('collapsed')) showHtml(el);
  }
}
async function showHtml(el){
  el.dataset.done = '1';
  const m = S.thread?.messages.find(x => x.id === +el.dataset.mid);
  if(!m) return;
  if(m.html === null){  // nog niet opgehaald (buiten de inbox): één keer van de server, intussen de tekst
    try{ m.html = (await api(`/api/messages/${m.id}/html`)).html; }catch(e){ return; }
  }
  if(m.html && el.isConnected) mountHtml(el, m.html);
}
function mountHtml(el, html){
  const f = document.createElement('iframe');
  f.className = 'mail-html'; f.title = 'Inhoud van de mail';
  // zonder allow-scripts kan de mail niets uitvoeren; same-origin enkel om de hoogte te kunnen meten
  f.setAttribute('sandbox', 'allow-same-origin allow-popups allow-popups-to-escape-sandbox');
  f.setAttribute('referrerpolicy', 'no-referrer');
  f.srcdoc = mailDoc(html);
  el.replaceChildren(f);
  el.classList.add('html');
  f.addEventListener('load', () => {
    const doc = f.contentDocument;
    if(!doc) return;
    const fit = () => {  // brede nieuwsbrieven verkleinen tot ze passen, en de hoogte volgen
      const body = doc.body;
      body.style.zoom = 1;
      const z = Math.min(1, f.clientWidth / Math.max(doc.documentElement.scrollWidth, 1));
      body.style.zoom = z;
      f.style.height = Math.ceil(body.getBoundingClientRect().height + 2) + 'px';
    };
    fit();
    doc.addEventListener('load', fit, true);  // afbeeldingen die later binnenkomen
    setTimeout(fit, 400); setTimeout(fit, 1500);
  });
}

async function doAction(a, btn){
  const t = S.thread; if(!t) return;
  const p = '/api/threads/'+t.tid;
  btn?.closest('[popover]')?.hidePopover();
  if(btn) btn.disabled = true;
  const label = btn?.innerHTML;
  try{
    if(a==='archive'){ inBackground(t.tid, p+'/archive', 'Gearchiveerd', 'Archiveren mislukt'); return closeThread(); }
    if(a==='trash'){ if(!await ask({title:'Naar de prullenbak?', msg:t.subject, ok:'Verwijderen', danger:true})) return;
      inBackground(t.tid, p+'/trash', 'Verwijderd', 'Verwijderen mislukt'); return closeThread(); }
    if(a==='dossier-remove'){ S.thread = await post(p+'/dossier/remove'); toast('Uit het dossier gehaald'); return renderThread(); }
    if(a==='ctx-edit'){ $('#ctx').innerHTML = contextForm(t); $('#ctx-text').focus(); return; }
    if(a==='ctx-cancel'){ $('#ctx').innerHTML = contextView(t); return; }
    if(a==='ctx-save'){ btn.innerHTML = TIE()+'Butler leest opnieuw…';
      S.thread = await post(p+'/context', {text: $('#ctx-text').value, sender: !!$('#ctx-sender')?.checked});
      toast('Context bewaard'); return renderThread(); }
    if(a==='read'){ await post(p+'/read'); toast('Gemarkeerd als gelezen'); }
    if(a==='flag' || a==='unflag'){ await post(p+'/flag', {flagged: a==='flag'}); toast(a==='flag' ? 'Gemarkeerd' : 'Markering weggehaald'); }
    if(a==='done'){ await post(p+'/done',{done:true}); toast('Klaar, uit de opvolglijst'); return closeThread(); }
    if(a==='undone'){ await post(p+'/done',{done:false}); toast('Heropend'); }
    if(a.startsWith('snooze')){
      const until = a==='snoozedate' ? $('#snooze-date').value : new Date(Date.now()+{snooze1:1,snooze3:3,snooze7:7}[a]*864e5).toISOString().slice(0,10);
      if(!until) return toast('Kies eerst een datum');
      await post(p+'/snooze',{until}); toast(`Gesnoozed tot ${new Date(until).toLocaleDateString('nl-BE',{weekday:'long',day:'numeric',month:'short'})}`); return closeThread(); }
    if(a==='tags'){ const v = await ask({title:'Tags bewerken', msg:'Scheid tags met een komma, bv. offerte, klant-x', input:true, value:t.tags.join(', '), ok:'Bewaren'}); if(v===null) return;
      await post(p+'/tags',{tags:v.split(',')}); }
    if(a==='summarize'){ btn.innerHTML = TIE()+'Bezig met samenvatten…'; S.thread = await post(p+'/summarize'); return renderThread(); }
    if(a==='draft'){ btn.innerHTML = TIE()+'Bezig…';
      const d = await post(p+'/draft',{instruction:$('#instr').value}); $('#reply').value = d.draft; $('#reply').focus();
      btn.innerHTML = TIE()+'Opnieuw'; return; }
    if(a==='savedraft'){ const body=$('#reply').value.trim(); if(!body) return toast('Schrijf eerst een antwoord');
      const r = await post(p+'/save-draft',{body, reply_all:$('#replyall').checked});
      toast('Concept staat in '+r.folder+'. Verstuur het vanuit Spark.'); $('#reply').value=''; return; }
    if(a==='send'){ const body=$('#reply').value.trim(); if(!body) return toast('Schrijf eerst een antwoord');
      if(!await ask({title:'Rechtstreeks versturen?', msg:$('#replyall').checked ? 'Naar alle ontvangers van deze thread.' : 'Naar de afzender van het laatste bericht.', ok:'Versturen'})) return;
      const r = await post(p+'/send',{body, reply_all:$('#replyall').checked, archive:$('#arch').checked});
      toast('Verstuurd naar '+r.to.join(', ')); return closeThread(); }
    S.thread = await api(p); renderThread();
  }catch(e){ toast('Mislukt: '+e.message); if(btn?.isConnected && label) btn.innerHTML = label; }
  finally{ if(btn?.isConnected) btn.disabled = false; }
}

document.addEventListener('click', e=>{
  const el = e.target.closest('[data-tab],[data-acc],[data-f],[data-cf],[data-s],[data-dossier],[data-dossier-back],[data-tid],[data-a],[data-toggle]');
  if(!el) return;
  if(el.dataset.dossier){ e.preventDefault(); if(S.thread) closeThread(); S.dossier = +el.dataset.dossier; scrollTo(0, 0); return load(true); }
  if(el.hasAttribute('data-dossier-back')){ S.dossier = null; return load(true); }
  if(el.dataset.tab){ if(S.tab!==el.dataset.tab || S.dossier){ S.tab=el.dataset.tab; S.dossier = null; load(true); } }
  else if(el.dataset.acc!==undefined){ S.account=el.dataset.acc; load(true); }
  else if(el.dataset.f){ S.filter=el.dataset.f; load(true); }
  else if(el.dataset.cf){ S.cfilter=el.dataset.cf; load(true); }
  else if(el.dataset.s){ senderAction(el.dataset.s, +el.dataset.i, el); }
  else if(el.dataset.tid){ if(e.metaKey||e.ctrlKey||e.shiftKey) return; e.preventDefault(); if(Date.now() - (S.swipedAt || 0) < 400) return; openThread(+el.dataset.tid); }
  else if(el.dataset.a){ doAction(el.dataset.a, el); }
  else if(el.hasAttribute('data-toggle')){ const m=el.parentElement; m.classList.toggle('collapsed'); el.setAttribute('aria-expanded', !m.classList.contains('collapsed')); showHtmlMessages(); }
});
