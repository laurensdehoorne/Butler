/* ---------- instellingen: meldingen, AI-dienst, kosten en de volledige configuratie ---------- */
const settings = $('#settings');
const pushSupported = () => 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
const onIOS = () => /iPhone|iPad/.test(navigator.userAgent);
const standalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone;
function urlBytes(b64){ const s=atob((b64+'='.repeat((4-b64.length%4)%4)).replace(/-/g,'+').replace(/_/g,'/')); return Uint8Array.from(s, c=>c.charCodeAt(0)); }
async function mySub(){
  if(!pushSupported()) return null;
  // ready blijft hangen als de service worker niet kon laden; dan gewoon geen abonnement
  const reg = await Promise.race([navigator.serviceWorker.ready, new Promise(r => setTimeout(() => r(null), 3000))]);
  return reg ? reg.pushManager.getSubscription() : null;
}
const eur = v => new Intl.NumberFormat('nl-BE',{style:'currency',currency:'EUR',minimumFractionDigits: v<1?3:2}).format(v||0);
const monthName = m => new Date(m+'-01').toLocaleDateString('nl-BE',{month:'long',year:'numeric'});
const DAYS = ['ma','di','wo','do','vr','za','zo'];

async function openSettings(view='root'){
  S.view = view; S.cfgErrors = {};
  $('#set-body').innerHTML = placeholder();
  openDialog(settings);
  const [dev, cost, sub, cfg] = await Promise.all([api('/api/push/devices').catch(()=>({devices:[]})), api('/api/costs').catch(()=>({months:[]})),
    mySub().catch(()=>null), api('/api/config').catch(()=>null)]);
  S.set = {devices: dev.devices, costs: cost.months, here: !!sub};
  S.cfg = cfg;
  if(view === 'account:new') S.view = newAccount();
  renderSettings();
}
const closeSettings = () => closeTopLayer(settings);
wireDialog(settings, closeSettings);

function renderSettings(){
  const v = S.view || 'root';
  $('#set-title').textContent = v === 'root' ? 'Instellingen' : v === 'accounts' ? 'Accounts'
    : v.startsWith('account:') ? (S.cfg.accounts[+v.split(':')[1]]?.name || 'Nieuw account')
    : (S.cfg.sections.find(s => s.id === v) || {}).title || 'Instellingen';
  $('#set-body').innerHTML = v === 'root' ? rootSettings() : v === 'accounts' ? accountsView()
    : v.startsWith('account:') ? accountView(+v.split(':')[1]) : sectionView(v);
}

function rootSettings(){
  const st = S.set;
  let push;
  if(!pushSupported()) push = `<div class="muted">${onIOS() && !standalone() ? 'Meldingen werken enkel vanuit de app op je beginscherm: tik in Safari op Delen, dan <b>Zet op beginscherm</b>, en open Butler daar (iOS 16.4 of nieuwer).' : 'Deze browser ondersteunt geen pushmeldingen.'}</div>`;
  else push = `<div class="line"><span>${st.here ? 'Dit toestel krijgt meldingen' : 'Dit toestel krijgt nog geen meldingen'}</span>
    <span class="group-actions">${st.here ? '<button class="btn" data-set="push-test">Stuur testmelding</button><button class="btn" data-set="push-off">Zet uit</button>' : `<button class="btn primary" data-set="push-on">${I('bell')}Zet meldingen aan</button>`}</span></div>`;
  const devs = st.devices.length ? st.devices.map(d=>`<div class="line"><span>${esc(d.device)}<span class="sub">sinds ${esc(when(d.created_at))}</span></span><button class="btn" data-set="push-forget" data-id="${esc(d.id)}">Vergeet</button></div>`).join('') : '<div class="muted">Nog geen toestellen.</div>';

  const provs = S.ai_providers || [];
  const ai = !provs.length ? '<div class="muted">Nog geen AI-sleutel. Vul er een in bij AI hieronder.</div>'
    : provs.map(p=>`<label class="line"><input type="radio" name="prov" value="${esc(p.id)}" ${p.id===S.ai_provider?'checked':''} ${provs.length<2?'disabled':''}><span><b>${esc(p.name)}</b>
        <span class="sub">Samenvatten met ${esc(p.triage_model)}, antwoorden met ${esc(p.draft_model)}</span></span></label>`).join('');

  const costs = !st.costs.length ? '<div class="muted">Nog geen AI-gebruik.</div>' : st.costs.map((m,i)=>`
    <details class="month" ${i===0?'open':''}>
      <summary><span>${esc(monthName(m.month))}</span><b>${eur(m.cost_eur)}</b></summary>
      ${m.lines.map(l=>`<div class="line"><span>${l.provider==='openai'?'ChatGPT':'Claude'}, ${esc(l.model)}<span class="sub">${l.kind==='draft'?'Antwoorden':'Samenvatten'}: ${l.calls} keer, ${(l.input_tokens/1000).toFixed(0)}k tokens in en ${(l.output_tokens/1000).toFixed(1)}k uit</span></span><span>${eur(l.cost_eur)}</span></div>`).join('')}
      ${m.uncertain?`<div class="muted" style="padding-bottom:12px">${m.uncertain} aanroep(en) zonder volledige prijs: het werkelijke bedrag kan hoger liggen.</div>`:''}
    </details>`).join('');

  const c = S.cfg;
  const nav = (view, title, sub) => `<button class="line nav" data-set="open" data-view="${view}"><span>${esc(title)}${sub?`<span class="sub">${esc(sub)}</span>`:''}</span>${I('chev')}</button>`;
  const config = !c ? '<div class="muted">De instellingen konden niet geladen worden.</div>'
    : nav('accounts', 'Accounts', c.accounts.length ? c.accounts.map(a => a.name || a.email).join(', ') : 'Nog geen mailaccount')
      + c.sections.map(s => nav(s.id, s.title, sectionSummary(s))).join('');

  return `
    <h3 class="group-h">Meldingen</h3><div class="group">${push}</div>
    <h3 class="group-h">Toestellen met meldingen</h3><div class="group">${devs}</div>
    <h3 class="group-h">AI-dienst</h3><div class="group">${ai}</div>
    <h3 class="group-h">Configuratie</h3><div class="group">${config}</div>
    ${c && !c.saved_in_app ? '<p class="fine">Je instellingen komen nu uit config.yaml. Zodra je hier iets bewaart, bewaart Butler alles in /data/config.yaml, en dat gaat dan voor.</p>' : ''}
    <h3 class="group-h">AI-kosten</h3><div class="group">${costs}</div>
    <p class="fine">Een schatting: verbruik maal lijstprijs, omgerekend naar euro. Wat je echt betaalt, staat in de console van Anthropic of OpenAI.</p>`;
}

function sectionSummary(s){
  const v = S.cfg.values;
  if(s.id === 'sync') return (v['app.sync_days'] ? `Laatste ${v['app.sync_days']} dagen` : 'Alle mail') + (v['app.sync_archive'] ? ', met archief' : ', zonder archief');
  if(s.id === 'ai') return !v['ai.enabled'] ? 'Uit' : (v['ai.provider'] === 'openai' ? 'ChatGPT' : 'Claude');
  if(s.id === 'notify') return (s.fields.find(f => f.key === 'notify.mode').options.find(o => o[0] === v['notify.mode']) || [, ''])[1];
  if(s.id === 'general') return v['app.timezone'] || '';
  return '';
}

/* een veld uit de spec van de server; path is de sleutel (app.sync_days) of accounts-veld */
function fieldHtml(f, value, path, secretSet){
  const err = S.cfgErrors[path] ? `<span class="err-msg">${esc(S.cfgErrors[path])}</span>` : '';
  const help = f.help ? `<span class="sub">${esc(f.help)}</span>` : '';
  const id = 'f-' + path.replace(/[^\w]/g, '_');
  if(f.kind === 'bool') return `<label class="line"><span>${esc(f.label)}${help}${err}</span><input type="checkbox" switch data-path="${esc(path)}" ${value ? 'checked' : ''}></label>`;
  let input;
  if(f.kind === 'select') input = `<select class="field" id="${id}" data-path="${esc(path)}">${f.options.map(([k, n]) => `<option value="${esc(k)}" ${k === value ? 'selected' : ''}>${esc(n)}</option>`).join('')}</select>`;
  else if(f.kind === 'textarea') input = `<textarea class="field short" id="${id}" data-path="${esc(path)}">${esc(value)}</textarea>`;
  else if(f.kind === 'days') input = `<div class="days" data-path="${esc(path)}" data-kind="days">${DAYS.map((d, i) => `<button type="button" class="chip" aria-pressed="${(value || []).includes(i + 1)}" data-day="${i + 1}">${d}</button>`).join('')}</div>`;
  else if(f.kind === 'secret') input = `<input class="field" type="password" id="${id}" data-path="${esc(path)}" autocomplete="new-password" placeholder="${secretSet ? '•••••••• (leeg = behouden)' : 'Nog niet ingevuld'}">`;
  else if(f.kind === 'number') input = `<input class="field" type="number" inputmode="numeric" id="${id}" data-path="${esc(path)}" value="${esc(value ?? '')}" ${f.min !== undefined ? `min="${f.min}"` : ''}>`;
  else if(f.kind === 'list') input = `<input class="field" type="text" id="${id}" data-path="${esc(path)}" data-kind="list" value="${esc((value || []).join(', '))}" autocapitalize="off">`;
  else input = `<input class="field" type="text" id="${id}" data-path="${esc(path)}" value="${esc(value ?? '')}" autocapitalize="off" autocorrect="off" spellcheck="false">`;
  return `<div class="fld"><label class="lbl" for="${id}">${esc(f.label)}</label>${input}${help}${err}</div>`;
}

function collect(root){
  const out = {};
  root.querySelectorAll('[data-path]').forEach(el => {
    const p = el.dataset.path;
    if(el.dataset.kind === 'days') out[p] = [...el.querySelectorAll('[aria-pressed=true]')].map(b => +b.dataset.day);
    else if(el.type === 'checkbox') out[p] = el.checked;
    else if(el.type === 'number') out[p] = el.value === '' ? '' : +el.value;
    else out[p] = el.value;
  });
  return out;
}

const backRow = (to='root', label='Instellingen') => `<button class="backbtn" data-set="open" data-view="${to}">${I('back')}<span>${esc(label)}</span></button>`;
const saveNote = () => `<p class="fine">${S.cfg.restarts ? 'Bewaren herstart Butler; dat duurt enkele seconden.' : 'Herstart Butler na het bewaren om de wijzigingen toe te passen.'}</p>`;

function sectionView(id){
  const s = S.cfg.sections.find(x => x.id === id);
  const v = S.cfg.values, set = S.cfg.secrets_set;
  return backRow() + `<div class="group" id="cfg-form">${s.fields.map(f => fieldHtml(f, v[f.key], f.key, set[f.key])).join('')}</div>`
    + `<div class="actions"><button class="btn primary" data-set="save-section" data-section="${esc(id)}">Bewaren</button></div>` + saveNote();
}

function accountsView(){
  const list = S.cfg.accounts.map((a, i) => `<button class="line nav" data-set="open" data-view="account:${i}">
      <span>${esc(a.name || a.email || 'Account')}<span class="sub">${esc(a.email || '')}</span></span>${I('chev')}</button>`).join('');
  return backRow() + `<div class="group">${list || '<div class="muted">Nog geen mailaccount.</div>'}</div>
    <div class="actions"><button class="btn" data-set="add-account">${I('plus')}Account toevoegen</button></div>`;
}

function newAccount(){
  const a = Object.fromEntries(S.cfg.account_fields.map(f => [f.key, f.default]));
  a.id = ''; a.password_set = false; a.isNew = true;
  S.cfg.accounts.push(a);
  return 'account:' + (S.cfg.accounts.length - 1);
}

function accountView(i){
  const a = S.cfg.accounts[i];
  const fields = S.cfg.account_fields.filter(f => !f.providers || f.providers.includes(a.provider));
  return backRow('accounts', 'Accounts') + `<div class="group" id="cfg-form" data-account="${i}">
      ${fields.map(f => fieldHtml(f, a[f.key], `accounts.${i}.${f.key}`, a.password_set)).join('')}</div>
    <div class="actions">
      <button class="btn primary" data-set="save-account" data-i="${i}">Bewaren</button>
      <button class="btn" data-set="test-account" data-i="${i}">Test verbinding</button>
      ${a.isNew ? '' : `<button class="btn danger" data-set="remove-account" data-i="${i}">${I('trash')}Verwijderen</button>`}
    </div>` + saveNote();
}

function readAccount(i){
  const a = S.cfg.accounts[i], vals = collect($('#cfg-form'));
  for(const [p, v] of Object.entries(vals)) a[p.split('.').slice(2).join('.')] = v;
  return a;
}
const accountsPayload = () => S.cfg.accounts.map(({isNew, password_set, ...a}) => a);

async function saveConfig(body, btn){
  btn.disabled = true; S.cfgErrors = {};
  try{
    const r = await api('/api/config', {method:'PUT', body:JSON.stringify(body)});
    const token = body.values?.['app.token'];
    if(token){ try{ localStorage.setItem('butler_token', token.trim()); }catch(e){} }
    if(!r.restarting){ toast('Bewaard. Herstart Butler om de wijzigingen toe te passen.'); return openSettings(S.view); }
    $('#set-body').innerHTML = empty('Butler herstart', 'Met je nieuwe instellingen. Dit duurt enkele seconden.', TIE());
    await waitForRestart();
    location.reload();
  }catch(e){
    S.cfgErrors = e.errors || {};
    if(body.values) Object.assign(S.cfg.values, body.values);  // wat je typte blijft staan om te verbeteren
    toast(e.message);
    renderSettings();
  }finally{ if(btn.isConnected) btn.disabled = false; }
}

async function waitForRestart(){
  await new Promise(r => setTimeout(r, 2500));
  for(let i = 0; i < 60; i++){
    try{ const r = await fetch('/health', {cache:'no-store'}); if(r.ok) return; }catch(e){}
    await new Promise(r => setTimeout(r, 1000));
  }
}

async function settingAction(a, el){
  if(a === 'open'){ S.view = el.dataset.view; S.cfgErrors = {}; S.cfg.accounts = S.cfg.accounts.filter(x => !x.isNew || S.view.startsWith('account:')); renderSettings(); settings.scrollTop = 0; return; }
  if(a === 'add-account'){ S.view = newAccount(); renderSettings(); return; }
  if(a === 'save-section') return saveConfig({values: collect($('#cfg-form'))}, el);
  if(a === 'save-account'){ readAccount(+el.dataset.i); return saveConfig({accounts: accountsPayload()}, el); }
  if(a === 'remove-account'){
    const acc = S.cfg.accounts[+el.dataset.i];
    if(!await ask({title:`${acc.name || acc.email} verwijderen?`, msg:'Butler synchroniseert dit account niet meer. Je mail op de server blijft gewoon staan.', ok:'Verwijderen', danger:true})) return;
    S.cfg.accounts.splice(+el.dataset.i, 1); S.view = 'accounts';
    return saveConfig({accounts: accountsPayload()}, el);
  }
  el.disabled = true;
  try{
    if(a === 'test-account'){
      const {isNew, password_set, ...acc} = readAccount(+el.dataset.i);
      const r = await post('/api/config/test-account', {account: acc});
      toast(`Verbonden: ${r.folders} mappen gevonden`);
      return;
    }
    if(a==='push-on'){
      const perm = await Notification.requestPermission(); // iOS vraagt enkel na een tik
      if(perm !== 'granted') throw new Error(onIOS() ? 'Meldingen zijn niet toegestaan. Zet ze aan bij Instellingen op je iPhone, Meldingen, Butler.' : 'Meldingen zijn niet toegestaan in deze browser.');
      const reg = await navigator.serviceWorker.ready;
      const {key} = await api('/api/push/key');
      const sub = await reg.pushManager.subscribe({userVisibleOnly:true, applicationServerKey:urlBytes(key)});
      const r = await post('/api/push/subscribe', {subscription: sub.toJSON()});
      S.set.here = true; S.set.devices = r.devices; toast('Meldingen staan aan');
    }
    if(a==='push-off'){
      const sub = await mySub();
      if(sub){ await post('/api/push/unsubscribe', {endpoint: sub.endpoint}); await sub.unsubscribe(); }
      S.set.here = false; S.set.devices = (await api('/api/push/devices')).devices; toast('Meldingen staan uit op dit toestel');
    }
    if(a==='push-test'){ await post('/api/push/test'); toast('Testmelding verstuurd'); }
    if(a==='push-forget'){ const r = await api('/api/push/devices/'+el.dataset.id, {method:'DELETE'}); S.set.devices = r.devices; toast('Toestel vergeten'); }
  }catch(e){ toast(e.message); }
  finally{ if(el.isConnected) el.disabled = false; }
  if(a !== 'test-account') renderSettings();
}
$('#gear').onclick = () => openSettings();
document.addEventListener('click', e => { if(e.target.closest('#add-first')) openSettings('account:new'); });
$('#s-close').onclick = closeSettings;
$('#set-body').addEventListener('click', e=>{
  const day = e.target.closest('[data-day]');
  if(day){ day.setAttribute('aria-pressed', day.getAttribute('aria-pressed') !== 'true'); return; }
  const el=e.target.closest('[data-set]'); if(el) settingAction(el.dataset.set, el);
});
$('#set-body').addEventListener('change', async e=>{
  // een ander soort account toont andere velden
  if(e.target.dataset.path?.endsWith('.provider') && S.view.startsWith('account:')){ readAccount(+S.view.split(':')[1]); renderSettings(); return; }
  if(e.target.name!=='prov') return;
  try{ await post('/api/settings/ai', {provider:e.target.value}); await loadAccounts(); toast('AI-dienst: '+(S.ai_providers.find(p=>p.id===S.ai_provider)||{}).name); }
  catch(err){ toast('Mislukt: '+err.message); }
  renderSettings();
});

/* ---------- service worker ---------- */
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('/sw.js').catch(()=>{});
  navigator.serviceWorker.addEventListener('message', e=>{ // tik op een melding terwijl de app open is
    const m = (e.data && e.data.open || '').match(/^#t=(\d+)/); if(m){ closeSettings(); openThread(+m[1]); }
  });
}
async function refreshNow(){
  const b = $('#refresh');
  try{ await post('/api/sync'); b.classList.add('spinning'); renderStatus(true);
    await new Promise(r => setTimeout(r, 2500)); await loadAccounts(); await load(); }
  catch(e){ toast(e.message); }
  finally{ b.classList.remove('spinning'); }
}
$('#refresh').onclick = refreshNow;

// de grote titel klapt in bij scrollen (met wat speling, zodat hij niet flikkert rond de drempel)
(() => {
  const head = document.querySelector('header');
  let compact = false;
  addEventListener('scroll', () => {
    const next = compact ? scrollY > 8 : scrollY > 48;
    if(next !== compact){ compact = next; head.classList.toggle('compact', compact); }
  }, {passive: true});
})();

/* ---------- aanraken: naar beneden trekken = vernieuwen, rij naar links vegen = verwijderen ---------- */
(() => {
  let g = null;  // lopend gebaar
  const PULL = 64;
  document.addEventListener('touchstart', e => {
    if(e.touches.length !== 1 || document.querySelector('dialog[open]') || !e.target.closest('main')) return;
    const t = e.touches[0];
    g = {x: t.clientX, y: t.clientY, row: e.target.closest('a.item[data-tid]:not(.moment):not(.agenda)'), mode: null, dx: 0, dy: 0};
  }, {passive: true});
  document.addEventListener('touchmove', e => {
    if(!g) return;
    const t = e.touches[0];
    g.dx = t.clientX - g.x; g.dy = t.clientY - g.y;
    if(!g.mode){
      if(Math.abs(g.dx) < 8 && Math.abs(g.dy) < 8) return;
      g.mode = Math.abs(g.dx) > Math.abs(g.dy) ? (g.row ? 'swipe' : 'none') : (g.dy > 0 && scrollY <= 0 ? 'pull' : 'none');
      g.dir = g.dx < 0 ? -1 : 1;  // links = verwijderen, rechts = markeren
      if(g.mode === 'swipe') startSwipe(g);
    }
    if(g.mode === 'pull'){
      const h = Math.min(g.dy * 0.45, PULL + 16);
      const ptr = $('#ptr');
      ptr.style.height = h + 'px';
      ptr.classList.toggle('ready', h >= PULL);
      ptr.querySelector('.i').style.rotate = (g.dy * 1.5) + 'deg';
    }
    if(g.mode === 'swipe'){
      const dx = g.dir < 0 ? Math.min(0, g.dx) : Math.max(0, g.dx);
      g.row.style.translate = dx + 'px 0';
      g.bg.classList.toggle('ready', Math.abs(dx) > threshold(g.row));
    }
  }, {passive: true});
  document.addEventListener('touchend', () => {
    if(!g) return;
    const cur = g; g = null;
    if(cur.mode === 'pull') endPull();
    if(cur.mode === 'swipe') endSwipe(cur);
  });
  document.addEventListener('touchcancel', () => { if(g?.mode === 'swipe') snapBack(g); if(g?.mode === 'pull') collapsePull(); g = null; });

  const threshold = row => Math.max(90, row.offsetWidth * 0.35);
  function startSwipe(g){
    g.row.classList.add('swiping');
    g.bg = document.createElement('div');
    const flagged = g.row.dataset.flagged === '1';
    g.bg.className = g.dir < 0 ? 'swipe-bg' : 'swipe-bg flag';
    g.bg.innerHTML = g.dir < 0 ? `${I('trash')}<span>Verwijder</span>` : `${I('flag')}<span>${flagged ? 'Markering weg' : 'Markeer'}</span>`;
    g.row.parentElement.style.position = 'relative';  // eerst: daarna meten de offsets t.o.v. de lijst
    Object.assign(g.bg.style, {top: g.row.offsetTop + 'px', height: g.row.offsetHeight + 'px',
                               left: g.row.offsetLeft + 'px', width: g.row.offsetWidth + 'px'});
    g.row.parentElement.insertBefore(g.bg, g.row);
  }
  function snapBack(g){
    g.row.classList.add('settle'); g.row.style.translate = '0 0';
    setTimeout(() => { g.bg.remove(); g.row.classList.remove('swiping', 'settle'); }, 220);
  }
  function endSwipe(g){
    S.swipedAt = Date.now();  // de tik die op het vegen volgt, opent de mail niet
    if(Math.abs(g.dx) <= threshold(g.row) || Math.sign(g.dx) !== g.dir) return snapBack(g);
    const tid = +g.row.dataset.tid;
    if(g.dir > 0){  // markeren: de rij blijft staan
      const on = g.row.dataset.flagged !== '1';
      snapBack(g);
      toast(on ? 'Gemarkeerd' : 'Markering weggehaald');
      post(`/api/threads/${tid}/flag`, {flagged: on}).catch(e => toast('Markeren mislukt: ' + e.message)).finally(() => load());
      return;
    }
    g.row.classList.add('settle'); g.row.style.translate = '-100% 0';
    setTimeout(() => { g.bg.remove(); g.row.classList.add('gone'); }, 200);
    inBackground(tid, `/api/threads/${tid}/trash`, 'Verwijderd', 'Verwijderen mislukt');
  }
  function collapsePull(){ const ptr = $('#ptr'); ptr.classList.add('settle'); ptr.style.height = '0px'; setTimeout(() => ptr.classList.remove('settle', 'ready', 'spinning'), 250); }
  async function endPull(){
    const ptr = $('#ptr');
    if(!ptr.classList.contains('ready')) return collapsePull();
    ptr.classList.add('settle', 'spinning'); ptr.style.height = '48px';
    await refreshNow();
    collapsePull();
  }
})();
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden && !S.thread){ loadAccounts(); load(); } });
setInterval(()=>{ if(!document.hidden && !S.thread){ loadAccounts(); load(); } }, 60000);

(async ()=>{
  renderStatus();
  await loadAccounts(); await load();
  const m = location.hash.match(/^#t=(\d+)/); if(m) openThread(+m[1], false);
})();
</script>
